<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Il sito del Convitto · Presentazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: palcoscenico 16:9 (1600x900 logici) scalato a tutto schermo; ogni slide è una "inquadratura" con camera che zooma sugli screenshot reali del sito. Tema unico scuro, pensato per il proiettore, nei colori istituzionali del sito (bosco + oro). */
:root{
  --bosco:#16241a; --bosco2:#1f3324; --bosco3:#2c4632;
  --oro:#c9a24a; --oro-chiaro:#e6cf8f; --crema:#f4efe3; --crema-dim:#b9b4a6;
  --ombra:rgba(6,12,8,.72);
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-testo:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--bosco);color:var(--crema);font-family:var(--f-testo);overflow:hidden;-webkit-font-smoothing:antialiased;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,var(--bosco2),#0c150f 75%);}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;flex:none;overflow:hidden;background:var(--bosco);box-shadow:0 30px 120px rgba(0,0,0,.6);}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1), visibility 0s linear .7s;transform:scale(1.04);}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1), visibility 0s;}
.slide.out{transform:scale(.97);}

/* tipografia */
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:14px;}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--oro);}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.02;}
h1{font-size:112px;}
h2{font-size:64px;}
h3{font-size:34px;}
em{font-style:italic;color:var(--oro-chiaro);}
p{margin:0;line-height:1.5;}
.lead{font-size:26px;color:var(--crema-dim);max-width:30em;}

/* entrate a cascata */
.rise{opacity:0;transform:translateY(26px);transition:opacity .8s ease, transform .9s cubic-bezier(.2,.7,.2,1);}
.slide.on .rise{opacity:1;transform:none;}
.slide.on .rise.d1{transition-delay:.15s}.slide.on .rise.d2{transition-delay:.3s}.slide.on .rise.d3{transition-delay:.45s}.slide.on .rise.d4{transition-delay:.6s}.slide.on .rise.d5{transition-delay:.75s}.slide.on .rise.d6{transition-delay:.9s}

/* TITOLO */
.bgimg{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:saturate(.8);}
.slide.on .bgimg.kb{animation:kb 22s ease-in-out infinite alternate;}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(12,21,15,.96) 0%,rgba(12,21,15,.82) 45%,rgba(12,21,15,.35) 100%);}
.title-wrap{position:absolute;left:120px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:30px;max-width:980px;}
.title-wrap h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotate(2deg);transition:opacity .9s ease, transform 1s cubic-bezier(.2,.7,.2,1);}
.slide.on .title-wrap h1 span{opacity:1;transform:none;}
.goldline{height:2px;width:0;background:linear-gradient(90deg,var(--oro),transparent);transition:width 1.6s cubic-bezier(.2,.7,.2,1) .6s;}
.slide.on .goldline{width:520px;}
.byline{font-size:20px;letter-spacing:.08em;color:var(--crema-dim);}
.byline b{color:var(--crema);font-weight:600;}
.url{font-family:var(--f-testo);font-size:19px;color:var(--oro-chiaro);letter-spacing:.04em;}

/* CAPITOLO */
.chap{position:absolute;inset:0;display:grid;grid-template-columns:520px 1fr;align-items:center;padding:0 120px;gap:40px;}
.chap .num{font-family:var(--f-display);font-size:360px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--oro);opacity:0;transform:translateX(-60px);transition:all 1.1s cubic-bezier(.2,.7,.2,1);}
.slide.on .chap .num{opacity:.9;transform:none;}
.chap .txt{display:flex;flex-direction:column;gap:22px;}
.chap h2{font-size:96px;}
.bgimg.dim{filter:blur(7px) saturate(.5) brightness(.3);}

/* SCHERMATA (shot) */
.shot{position:absolute;inset:0;display:grid;grid-template-columns:1010px 1fr;gap:44px;padding:56px 56px 60px 64px;align-items:center;}
.side{max-height:780px;}
.browser{position:relative;width:1010px;border-radius:14px;overflow:hidden;background:#0c150f;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(201,162,74,.25);}
.bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#233a29;}
.bar i{width:11px;height:11px;border-radius:50%;background:#48604e;display:block;}
.bar .addr{margin-left:14px;flex:1;height:22px;border-radius:11px;background:#16241a;font-size:12.5px;color:var(--crema-dim);display:flex;align-items:center;padding:0 12px;letter-spacing:.02em;}
.vp{position:relative;width:1010px;height:631px;overflow:hidden;}
.cam{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;transition:transform 1.4s cubic-bezier(.45,.05,.2,1);}
.cam img{width:1440px;height:900px;display:block;}
.spot{position:absolute;border-radius:10px;box-shadow:0 0 0 3000px rgba(6,12,8,.58),0 0 0 2px var(--oro),0 0 30px rgba(201,162,74,.55);transition:all 1.4s cubic-bezier(.45,.05,.2,1);pointer-events:none;}
.spot.off{box-shadow:0 0 0 3000px rgba(6,12,8,0),0 0 0 2px rgba(201,162,74,0);}
.spot::after{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--oro);opacity:0;}
.spot.pulse::after{animation:pulse 1.6s ease-out 1.3s 2;}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.side{display:flex;flex-direction:column;gap:22px;min-width:0;}
.side h2{font-size:50px;}
.steps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
.steps li{font-size:18.5px;line-height:1.4;color:var(--crema-dim);padding:8px 0 8px 18px;border-left:2px solid rgba(201,162,74,.18);opacity:.28;transform:translateX(10px);transition:all .6s ease;}
.steps li b{color:var(--crema);font-weight:600;}
.steps li.seen{opacity:.55;transform:none;}
.steps li.cur{opacity:1;transform:none;border-left-color:var(--oro);color:var(--crema);}
.steps li.cur b{color:var(--oro-chiaro);}

/* MOSAICO */
.mosaic{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column;gap:28px;}
.tiles{display:grid;gap:26px;flex:1;min-height:0;perspective:1600px;}
.tiles.c4{grid-template-columns:repeat(2,1fr);}
.tiles.c6{grid-template-columns:repeat(3,1fr);}
.tile{position:relative;border-radius:12px;overflow:hidden;background:#0c150f;box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 1px rgba(201,162,74,.2);opacity:0;transform:translateY(60px) rotateX(18deg);transition:opacity .8s ease, transform 1s cubic-bezier(.2,.7,.2,1);}
.slide.on .tile{opacity:1;transform:none;}
.tile img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform 6s ease;}
.tile:hover img{transform:scale(1.08);}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(8,14,10,.94));font-size:17px;line-height:1.35;color:var(--crema);}
.tile figcaption b{display:block;font-family:var(--f-display);font-size:26px;font-weight:500;color:var(--oro-chiaro);}

/* TELEFONI */
.phones{position:absolute;inset:0;padding:56px 80px 64px;display:flex;flex-direction:column;gap:18px;}
.prow{display:flex;justify-content:center;gap:38px;flex:1;align-items:center;}
.phone{width:262px;border-radius:40px;padding:12px;background:#0b110d;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1.5px #3c5442;opacity:0;transform:translateY(90px);transition:opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);}
.slide.on .phone{opacity:1;transform:none;}
.phone .scr{border-radius:30px;overflow:hidden;height:540px;}
.phone img{width:100%;display:block;}
.phone.scroll img{animation:none;}
.slide.on .phone.scroll img{animation:pscroll 14s ease-in-out 1.5s infinite alternate;}
@keyframes pscroll{from{transform:translateY(0)}to{transform:translateY(-10%)}}
.phone .cap{font-size:16px;color:var(--crema-dim);text-align:center;margin-top:14px;}

/* CONFRONTO */
.compare{position:absolute;inset:0;padding:60px 80px;display:grid;grid-template-columns:1fr 420px;gap:50px;align-items:center;}
.cmp{position:relative;width:1000px;height:625px;border-radius:14px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(201,162,74,.25);cursor:ew-resize;touch-action:none;}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;}
.cmp .after{clip-path:inset(0 0 0 50%);}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--oro);transform:translateX(-1.5px);}
.cmp .handle::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--oro);color:var(--bosco);font-size:13px;font-weight:700;padding:10px 12px;border-radius:30px;white-space:nowrap;}
.cmp .lab{position:absolute;top:16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(8,14,10,.8);padding:6px 12px;border-radius:4px;}
.cmp .lab.l{left:16px}.cmp .lab.r{right:16px;color:var(--oro-chiaro);}

/* TESTO a schede */
.cards{position:absolute;inset:0;padding:90px 110px;display:flex;flex-direction:column;gap:46px;}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;}
.card{border-top:2px solid var(--oro);padding-top:26px;display:flex;flex-direction:column;gap:14px;}
.card h3{font-size:38px;}
.card p{font-size:21px;color:var(--crema-dim);}
.card .ic{font-family:var(--f-display);font-size:22px;color:var(--oro);letter-spacing:.1em;}

/* AGENDA */
.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 40px;}
.agenda a{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:baseline;padding:22px 0;border-bottom:1px solid rgba(201,162,74,.22);color:var(--crema);text-decoration:none;cursor:pointer;}
.agenda a:hover .t,.agenda a:focus-visible .t{color:var(--oro-chiaro);}
.agenda .n{font-family:var(--f-display);font-size:44px;color:var(--oro);}
.agenda .t{font-family:var(--f-display);font-size:34px;transition:color .3s;}
.agenda .s{grid-column:2;font-size:17px;color:var(--crema-dim);}

/* QUIZ */
.quiz{position:absolute;inset:0;padding:58px 80px;display:flex;flex-direction:column;gap:26px;}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:22px;flex:1;min-height:0;perspective:1400px;}
.qc{position:relative;cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;text-align:left;}
.qc .in{position:absolute;inset:0;transition:transform .9s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;}
.qc.flip .in{transform:rotateY(180deg);}
.qc .fr,.qc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;}
.qc .fr{background:var(--bosco2);box-shadow:0 0 0 1px rgba(201,162,74,.3);}
.qc .fr .k{font-family:var(--f-display);font-size:40px;color:var(--oro);line-height:1;}
.qc .fr p{font-size:20px;line-height:1.38;}
.qc .fr small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-dim);}
.qc .bk{background:linear-gradient(150deg,var(--oro-chiaro),var(--oro));color:var(--bosco);transform:rotateY(180deg);}
.qc .bk small{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.qc .bk p{font-family:var(--f-display);font-size:30px;line-height:1.12;font-weight:600;}
.qc .bk span{font-size:16px;line-height:1.35;}
.qc:focus-visible{outline:3px solid var(--oro-chiaro);outline-offset:4px;border-radius:14px;}

/* QR */
.qr{position:absolute;inset:0;display:grid;grid-template-columns:1fr 420px;gap:80px;align-items:center;padding:0 120px;}
.qrbox{background:var(--crema);padding:34px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.qrbox svg{width:100%;height:auto;display:block;}
.qrbox .u{margin-top:16px;text-align:center;color:var(--bosco);font-weight:700;font-size:17px;letter-spacing:.02em;}
.try{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
.try span{font-size:21px;padding:12px 20px;border-radius:40px;border:1px solid rgba(201,162,74,.5);color:var(--oro-chiaro);}

/* CROMO: barra avanzamento, contatori, controlli */
#hud{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:18px;padding:0 28px;font-size:14px;color:var(--crema-dim);letter-spacing:.06em;z-index:5;pointer-events:none;}
#hud .ch{text-transform:uppercase;letter-spacing:.18em;font-weight:600;font-size:12.5px;}
#hud .sp{flex:1;}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--oro);width:0;transition:width .6s ease;z-index:6;}
.ctl{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;opacity:.25;transition:opacity .3s;}
.ctl:hover,.ctl:focus-within{opacity:1;}
.ctl button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,162,74,.5);background:rgba(12,21,15,.8);color:var(--crema);font-size:17px;cursor:pointer;}
.ctl button:focus-visible{outline:2px solid var(--oro-chiaro);outline-offset:2px;}
#overview{position:fixed;inset:0;z-index:30;background:rgba(8,14,10,.96);overflow:auto;padding:40px max(16px,4vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-content:start;}
#overview button{background:var(--bosco2);border:1px solid rgba(201,162,74,.25);border-radius:8px;color:var(--crema);text-align:left;padding:14px;font:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
#overview button b{color:var(--oro);font-size:12px;letter-spacing:.14em;}
#overview button.cur{border-color:var(--oro);}
#help{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(12,21,15,.92);border:1px solid rgba(201,162,74,.4);border-radius:10px;padding:12px 18px;font-size:14px;color:var(--crema-dim);z-index:25;transition:opacity 1s;max-width:calc(100% - 32px);text-align:center;}
#help kbd{font-family:var(--f-testo);background:var(--bosco3);border-radius:4px;padding:1px 7px;color:var(--crema);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important;}
}

/* il sito in numeri */
.stats{position:absolute;inset:0;padding:70px 100px 80px;display:flex;flex-direction:column;gap:34px;}
.stats .top{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;}
.stats h2{font-size:70px;margin-top:14px;}
.stats .src{font-size:15px;color:var(--crema-dim);max-width:360px;text-align:right;margin:0;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;}
.kpi{border-top:2px solid var(--oro);padding-top:18px;}
.kpi .v{font-family:var(--f-display);font-size:76px;line-height:1;color:var(--oro-chiaro);font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:44px;color:var(--oro);}
.kpi .l{font-size:19px;color:var(--crema-dim);margin-top:10px;line-height:1.35;}
.wk{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;}
.wk .wt{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-dim);}
.bars{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:22px;align-items:end;min-height:0;}
.bars .b{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;}
.bars .b i{display:block;width:100%;height:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--oro-chiaro),var(--oro));transition:height 1.1s cubic-bezier(.2,.7,.2,1);}
.slide.on .bars .b i{height:calc(var(--h) * .78);}
.bars .n{font-family:var(--f-display);font-size:30px;color:var(--crema);}
.bars .d{font-size:15px;color:var(--crema-dim);white-space:nowrap;}
.rk{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:80px;}
.rk h3{font-size:30px;color:var(--oro-chiaro);margin:0 0 22px;font-family:var(--f-display);font-weight:500;}
.rk .row{display:grid;grid-template-columns:310px 1fr 56px;grid-template-rows:auto auto;align-items:center;column-gap:16px;padding:10px 0;border-bottom:1px solid rgba(201,162,74,.18);}
.rk .t{font-size:22px;color:var(--crema);}
.rk .bar{height:14px;background:rgba(244,239,227,.06);border-radius:7px;overflow:hidden;}
.rk .bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--oro),var(--oro-chiaro));transition:width 1s cubic-bezier(.2,.7,.2,1);}
.slide.on .rk .bar i{width:var(--w);}
.rk .n{font-family:var(--f-display);font-size:30px;text-align:right;color:var(--oro-chiaro);font-variant-numeric:tabular-nums;}
.rk .x{grid-column:1/-1;font-size:14px;color:var(--oro);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
@media (prefers-reduced-motion:reduce){.bars .b i,.rk .bar i{transition:none}}
</style>

<div id="viewport"><div id="stage" aria-live="polite"></div></div>
<div class="ctl" role="toolbar" aria-label="Controlli presentazione">
  <button id="b-prev" type="button" aria-label="Indietro">&#8592;</button>
  <button id="b-next" type="button" aria-label="Avanti">&#8594;</button>
  <button id="b-grid" type="button" aria-label="Indice delle slide">&#9638;</button>
  <button id="b-full" type="button" aria-label="Schermo intero">&#10530;</button>
</div>
<div id="overview" hidden></div>

const qset=s=>QUIZ.slice(s.from||0,s.to||QUIZ.length);
function nsteps(s){ if(s.t==='shot') return s.steps.length; if(s.t==='quiz') return qset(s).length+1; return 1; }

function build(s,i){
  const d=document.createElement('section'); d.className='slide'; d.setAttribute('aria-roledescription','slide');
  let h='';
  if(s.t==='title'){
    const words="Il sito del Convitto".split(' ');
    h=`<div class="bgimg kb" style="background-image:url(${IMG(s.bg)})"></div><div class="veil"></div>
    <div class="title-wrap"><div class="eyebrow rise">Formazione del personale · A.S. 2026/2027</div>
    <h1>${words.map((w,k)=>`<span style="transition-delay:${.2+k*.14}s">${w}</span>`).join(' ')}</h1>
    <div class="goldline"></div>
    <p class="lead rise d4">Sezioni, funzioni e percorsi del sito istituzionale del Convitto “R. A. Costaggini”.</p>
    <p class="byline rise d5"><b>Educatore Michele Gaggiano</b></p>
    <p class="url rise d6">convitto.alberghierorieti.edu.it</p></div>`;
  } else if(s.t==='chap'){
    h=`<div class="bgimg kb dim" style="background-image:url(${IMG(s.bg)})"></div>
    <div class="chap"><div class="num">${['','I','II','III','IV','V','VI'][s.n]}</div>
    <div class="txt"><div class="eyebrow rise">Capitolo ${s.n}</div><h2 class="rise d1">${CH[s.n]}</h2><p class="lead rise d2">${s.sub}</p></div></div>`;
  } else if(s.t==='shot'){
    h=`<div class="shot"><div class="browser rise"><div class="bar"><i></i><i></i><i></i><div class="addr">🔒 ${s.url}</div></div>
    <div class="vp"><div class="cam"><img src="${IMG(s.img)}" alt="Schermata: ${s.eb}" loading="lazy"></div><div class="spot off"></div></div></div>
    <div class="side"><div class="eyebrow rise d1">${s.eb}</div><h2 class="rise d2">${s.h}</h2>
    <ol class="steps">${s.steps.map(x=>`<li>${x[1]}</li>`).join('')}</ol></div></div>`;
  } else if(s.t==='mosaic'){
    h=`<div class="mosaic"><div class="eyebrow rise">${s.eb}</div><h2 class="rise d1">${s.h}</h2>
    <div class="tiles c${s.n}">${s.tiles.map((t,k)=>`<figure class="tile" style="transition-delay:${.35+k*.13}s;margin:0"><img src="${IMG(t[0])}" alt="" loading="lazy"><figcaption><b>${t[1]}</b>${t[2]}</figcaption></figure>`).join('')}</div></div>`;
  } else if(s.t==='cards'){
    h=`<div class="cards"><div class="eyebrow rise">${s.eb}</div><h2 class="rise d1" style="font-size:78px">${s.h}</h2>
    <div class="cgrid">${s.items.map((c,k)=>`<div class="card rise d${k+2}"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}</div></div>`;
  } else if(s.t==='agenda'){
    const subs=["Home, notizie, prima impressione","Menu, ricerca, assistente, mappa","Iscrizione, accoglienza, moduli","Tour virtuale, persone, talenti","Lettura facilitata, lingue, smartphone","Dove indirizzare le famiglie"];
    h=`<div class="cards"><div class="eyebrow rise">Il percorso di oggi</div><h2 class="rise d1" style="font-size:78px">Sei <em>capitoli</em></h2>
    <nav class="agenda">${[1,2,3,4,5,6].map(n=>`<a class="rise d${n}" data-go="${n}" tabindex="0"><span class="n">${['','I','II','III','IV','V','VI'][n]}</span><span class="t">${CH[n]}</span><span class="s">${subs[n-1]}</span></a>`).join('')}</nav></div>`;
  } else if(s.t==='qr'){
    h=`<div class="qr"><div style="display:flex;flex-direction:column;gap:26px"><div class="eyebrow rise">Proviamo insieme</div>
    <h2 class="rise d1" style="font-size:80px">Prendete il <em>telefono</em></h2>
    <p class="lead rise d2">Inquadrate il codice, aprite la lente in alto e provate a cercare:</p>
    <div class="try rise d3"><span>orari dei pasti</span><span>cosa devo portare</span><span>quanto costa</span><span>bullismo</span><span>uscite autonome</span></div>
    <p class="lead rise d4" style="font-size:21px">Poi fate la stessa domanda all'assistente virtuale e confrontate le risposte.</p></div>
    <div class="qrbox rise d2">${QR_SVG}<div class="u">convitto.alberghierorieti.edu.it</div></div></div>`;
  } else if(s.t==='compare'){
    h=`<div class="compare"><div class="cmp rise" id="cmp"><img src="${IMG('lettura-off')}" alt="Pagina con lettura normale"><img class="after" src="${IMG('lettura-on')}" alt="Pagina con lettura facilitata"><div class="handle"></div><span class="lab l">Normale</span><span class="lab r">Lettura facilitata</span></div>
    <div class="side"><div class="eyebrow rise d1">Lettura facilitata</div><h2 class="rise d2">Un tocco su <em>Aa</em></h2>
    <p class="lead rise d3" style="font-size:22px">Caratteri più grandi, righe più distanziate, link sottolineati e focus ben visibile. Trascinate il cursore sull'immagine per confrontare.</p>
    <p class="lead rise d4" style="font-size:18px">Utile per chi ha difficoltà di lettura, per i nonni, per chi legge da un telefono piccolo.</p></div></div>`;
  } else if(s.t==='phones'){
    h=`<div class="phones"><div class="eyebrow rise">${s.eb}</div><h2 class="rise d1">${s.h}</h2>
    <div class="prow">${s.items.map((p,k)=>`<div style="display:flex;flex-direction:column"><div class="phone ${p[2]?'scroll':''}" style="transition-delay:${.3+k*.16}s"><div class="scr"><img src="${IMG(p[0])}" alt="Schermata da smartphone: ${p[1]}" loading="lazy"></div></div><div class="cap rise d4">${p[1]}</div></div>`).join('')}</div></div>`;
  } else if(s.t==='quiz'){
    const base=s.from||0;
    h=`<div class="quiz"><div class="eyebrow rise">Gioco · ${s.round||''}</div><h2 class="rise d1">Dove lo <em>trovo?</em></h2>
    <div class="qgrid">${qset(s).map((q,k0)=>{const k=base+k0; return `<button type="button" class="qc rise" style="transition-delay:${.25+k0*.07}s" aria-label="Domanda ${k+1}: ${q[0].replace(/"/g,'')}"><span class="in"><span class="fr"><span class="k">${k+1}</span><p>${q[0]}</p><small>Tocca per la risposta</small></span><span class="bk"><small>Risposta</small><p>${q[1]}</p><span>${q[2]}</span></span></span></button>`;}).join('')}</div></div>`;
  } else if(s.t==='stats'){
    const mx=Math.max(...s.weeks.map(w=>w[1]));
    h=`<div class="stats"><div class="top"><div><div class="eyebrow rise">${s.eb}</div><h2 class="rise d1">${s.h}</h2></div><p class="src rise d2">${s.src}</p></div>
    <div class="kpis">${s.kpi.map((k,j)=>`<div class="kpi rise d${j+2}"><div class="v">${k[0]}</div><div class="l">${k[1]}</div></div>`).join('')}</div>
    <div class="wk rise d4"><div class="wt">${s.wt}</div><div class="bars">${s.weeks.map((w,j)=>`<div class="b"><span class="n">${w[1]}</span><i style="--h:${(w[1]/mx*100).toFixed(1)}%;transition-delay:${.7+j*.12}s"></i><span class="d">${w[0]}</span></div>`).join('')}</div></div></div>`;
  } else if(s.t==='rank'){
    h=`<div class="stats"><div class="top"><div><div class="eyebrow rise">${s.eb}</div><h2 class="rise d1">${s.h}</h2></div><p class="src rise d2">${s.src}</p></div>
    <div class="rk">${s.cols.map((c,j)=>{const mx=Math.max(...c[1].map(r=>r[1]));return `<div class="col rise d${j+2}"><h3>${c[0]}</h3>${c[1].map((r,k)=>`<div class="row"><span class="t">${r[0]}</span><span class="bar"><i style="--w:${(r[1]/mx*100).toFixed(1)}%;transition-delay:${.6+k*.1+j*.2}s"></i></span><span class="n">${r[1]}</span>${r[2]?`<span class="x">${r[2]}</span>`:''}</div>`).join('')}</div>`;}).join('')}</div></div>`;
  } else if(s.t==='end'){
    h=`<div class="bgimg kb" style="background-image:url(${IMG(s.bg)})"></div><div class="veil"></div>
    <div class="qr" style="position:absolute"><div style="display:flex;flex-direction:column;gap:28px"><div class="eyebrow rise">Grazie</div>
    <h1 class="rise d1" style="font-size:96px">Il sito è <em>di tutti noi</em></h1>
    <p class="lead rise d2">Un'informazione da correggere, una notizia da pubblicare, un'idea per migliorare una pagina: segnalatela.</p>
    <p class="byline rise d3"><b>Educatore Michele Gaggiano</b></p></div>
    <div class="qrbox rise d3" style="width:340px;justify-self:end">${QR_SVG}<div class="u">convitto.alberghierorieti.edu.it</div></div></div>`;
  }
  d.innerHTML=h; stage.appendChild(d); return d;
}

SLIDES.forEach((s,i)=>els.push(build(s,i)));
const hud=document.createElement('div'); hud.id='hud'; hud.innerHTML='<span class="ch"></span><span class="sp"></span><span class="no"></span>'; stage.appendChild(hud);
const prog=document.createElement('div'); prog.id='prog'; stage.appendChild(prog);

/* camera sugli screenshot */
function frame(d,s,k){
  const vp=d.querySelector('.vp'), cam=d.querySelector('.cam'), spot=d.querySelector('.spot');
  const W=1010,H=631, s0=W/1440, r=s.steps[k][0];
  if(!r){ cam.style.transform=`scale(${s0})`; spot.className='spot off'; spot.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`; return; }
  let z=Math.min(W*.82/(r[2]*s0), H*.78/(r[3]*s0), 2.4); z=Math.max(z,1);
  const sc=s0*z;
  let tx=W/2-(r[0]+r[2]/2)*sc, ty=H/2-(r[1]+r[3]/2)*sc;
  tx=Math.min(0,Math.max(W-1440*sc,tx)); ty=Math.min(0,Math.max(H-900*sc,ty));
  cam.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  const p=8;
  spot.style.cssText=`left:${r[0]*sc+tx-p}px;top:${r[1]*sc+ty-p}px;width:${r[2]*sc+2*p}px;height:${r[3]*sc+2*p}px`;
  spot.className='spot'; void spot.offsetWidth; spot.className='spot pulse';
}

function render(){
  const s=SLIDES[idx];
  els.forEach((e,i)=>{e.classList.toggle('on',i===idx); e.classList.toggle('out',i<idx); e.setAttribute('aria-hidden',i===idx?'false':'true');});
  const d=els[idx];
  if(s.t==='shot'){
    frame(d,s,step);
    d.querySelectorAll('.steps li').forEach((li,i)=>{li.className=i<step?'seen':(i===step?'cur':'');});
  }
  if(s.t==='quiz'){
    d.querySelectorAll('.qc').forEach((c,i)=>c.classList.toggle('flip',i<step));
  }
  const ch=s.ch!=null?s.ch:(s.n||0);
  hud.querySelector('.ch').textContent=ch?`${['','I','II','III','IV','V','VI'][ch]} · ${CH[ch]}`:'';
  hud.querySelector('.no').textContent=`${idx+1} / ${SLIDES.length}`;
  hud.style.opacity=(s.t==='title'||s.t==='end')?0:1;
  prog.style.width=((idx+ (step/Math.max(1,nsteps(s))) /1)/(SLIDES.length-1)*100)+'%';
  try{ history.replaceState(null,'','#s'+(idx+1)); }catch(e){}
}
function next(){ const s=SLIDES[idx]; if(step<nsteps(s)-1){step++;render();} else if(idx<SLIDES.length-1){idx++;step=0;render();} }
function prev(){ if(step>0){step--;render();} else if(idx>0){idx--;step=nsteps(SLIDES[idx])-1; if(SLIDES[idx].t==='quiz') step=0; render();} }
function go(i){ idx=Math.max(0,Math.min(SLIDES.length-1,i)); step=0; render(); }

/* agenda cliccabile */
stage.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');
  if(a){ const n=+a.dataset.go; go(SLIDES.findIndex(s=>s.t==='chap'&&s.n===n)); return; }
  const q=e.target.closest('.qc');
  if(q){ q.classList.toggle('flip'); return; }
  if(e.target.closest('#cmp')) return;
  if(e.target.closest('.shot .browser')) next();
});
stage.addEventListener('keydown',e=>{ const a=e.target.closest('[data-go]'); if(a&&(e.key==='Enter')){a.click();} });

/* confronto trascinabile */
const cmp=document.getElementById('cmp');
if(cmp){ const aft=cmp.querySelector('.after'), hd=cmp.querySelector('.handle');
  const setp=x=>{const r=cmp.getBoundingClientRect(); const p=Math.max(0,Math.min(1,(x-r.left)/r.width)); aft.style.clipPath=`inset(0 0 0 ${p*100}%)`; hd.style.left=(p*100)+'%';};
  let drag=false; cmp.addEventListener('pointerdown',e=>{drag=true;cmp.setPointerCapture(e.pointerId);setp(e.clientX);});
  cmp.addEventListener('pointermove',e=>{if(drag)setp(e.clientX);}); cmp.addEventListener('pointerup',()=>drag=false);
}

/* tastiera, clic, swipe */
document.addEventListener('keydown',e=>{
  if(!ov.hidden){ if(e.key==='Escape'||e.key==='g'||e.key==='G'){ov.hidden=true;} return; }
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ if(e.key==='Enter'&&e.target.closest('button,a'))return; e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home') go(0); else if(e.key==='End') go(SLIDES.length-1);
  else if(e.key==='f'||e.key==='F') full();
  else if(e.key==='g'||e.key==='G') showOv();
});
let tx0=null; document.addEventListener('touchstart',e=>{ if(e.target.closest('#cmp'))return; tx0=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{ if(tx0==null)return; const dx=e.changedTouches[0].clientX-tx0; if(Math.abs(dx)>50){dx<0?next():prev();} tx0=null;});
document.getElementById('b-next').onclick=next; document.getElementById('b-prev').onclick=prev;
document.getElementById('b-full').onclick=full; document.getElementById('b-grid').onclick=showOv;
function full(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }catch(e){} }

/* indice */
const ov=document.getElementById('overview');
function showOv(){
  ov.innerHTML=SLIDES.map((s,i)=>{const t=(s.h||(s.t==='chap'?CH[s.n]:s.t==='title'?'Il sito del Convitto':s.t==='qr'?'Proviamo insieme':s.t==='quiz'?'Dove lo trovo?':s.t==='compare'?'Lettura facilitata':s.t==='agenda'?'Sei capitoli':'Grazie')).replace(/<[^>]+>/g,'');
    return `<button type="button" data-i="${i}" class="${i===idx?'cur':''}"><b>${i+1}${s.t==='chap'?' · CAPITOLO '+s.n:''}</b>${t}</button>`;}).join('');
  ov.hidden=false;
}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(b){ov.hidden=true; go(+b.dataset.i);} else ov.hidden=true;});

/* scala del palcoscenico */
function fit(){ const s=Math.min(window.innerWidth/1600, window.innerHeight/900); stage.style.transform=`scale(${s})`; }
window.addEventListener('resize',fit); fit();

const m=(location.hash||'').match(/^#s(\d+)$/); if(m) idx=Math.min(SLIDES.length-1,Math.max(0,+m[1]-1));
render();
setTimeout(()=>{const h=document.getElementById('help'); if(h){h.style.opacity=0; setTimeout(()=>h.hidden=true,1100);}},6000);
})();

</script>
</body>
</html>
