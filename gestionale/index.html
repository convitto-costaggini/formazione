<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Il gestionale, passo passo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
/* Layout: palco 1600x900 scalato; a sinistra lo schermo del gestionale con cursore animato, a destra i passi */
:root{
  --bosco:#16241a; --bosco2:#1f3324; --bosco3:#2c4632;
  --oro:#c9a24a; --oro-chiaro:#e6cf8f; --crema:#f4efe3; --crema-dim:#b9b4a6; --verde:#3fa45b;
  --f-display:"Cormorant Garamond", Georgia, serif;
  --f-testo:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bosco);color:var(--crema);font-family:var(--f-testo);overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,var(--bosco2),#0c150f 75%)}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;overflow:hidden;background:var(--bosco)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--oro)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.05;text-wrap:balance}
em{font-style:italic;color:var(--oro-chiaro)}
.rise{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.slide.on .rise{opacity:1;transform:none}
.slide.on .d1{transition-delay:.15s}.slide.on .d2{transition-delay:.3s}.slide.on .d3{transition-delay:.45s}.slide.on .d4{transition-delay:.6s}
/* titolo */
.cover{position:absolute;inset:0;padding:120px 130px;display:flex;flex-direction:column;justify-content:center;gap:28px;
  background:linear-gradient(90deg,rgba(22,36,26,.99) 0%,rgba(22,36,26,.96) 55%,rgba(22,36,26,.55) 100%),var(--cover) right center/cover no-repeat}
.cover h1{font-size:118px;max-width:900px}
.cover .lead{font-size:28px;color:var(--crema-dim);max-width:760px;line-height:1.35;margin:0}
.cover .by{font-size:20px;color:var(--oro-chiaro);margin:0}
/* come funziona */
.how{position:absolute;inset:0;padding:110px 130px;display:flex;flex-direction:column;gap:56px}
.how h2{font-size:82px}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.how li{border-top:2px solid var(--oro);padding-top:24px;display:flex;flex-direction:column;gap:12px}
.how li b{font-family:var(--f-display);font-size:40px;font-weight:500;color:var(--oro-chiaro)}
.how li span{font-size:23px;color:var(--crema-dim);line-height:1.4}
.how .note{font-size:20px;color:var(--crema-dim);margin:0}
/* compito */
.task{position:absolute;inset:0;padding:120px 130px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.task .num{position:absolute;right:110px;top:70px;font-family:var(--f-display);font-size:330px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--oro);opacity:.55}
.task h2{font-size:92px;max-width:1050px}
.task .q{font-size:38px;line-height:1.3;max-width:1100px;margin:0;color:var(--crema)}
.task .q b{color:var(--oro-chiaro);font-weight:700}
.task .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.task .apri{display:inline-flex;gap:12px;align-items:center;font-size:22px;font-weight:700;color:var(--oro-chiaro);border:2px solid var(--oro);padding:10px 22px;border-radius:40px;text-decoration:none}
.task .apri:hover,.task .apri:focus-visible{background:rgba(201,162,74,.18);outline:none}
.side .apri{align-self:flex-start;font-size:16px;font-weight:700;color:var(--oro-chiaro);text-decoration:none;border-bottom:1px solid var(--oro)}
.task .think{display:inline-flex;align-self:flex-start;gap:14px;align-items:center;font-size:22px;color:var(--bosco);background:var(--oro-chiaro);padding:12px 22px;border-radius:40px;font-weight:700}
/* passo passo */
.walk{position:absolute;inset:0;padding:46px 40px 70px 46px;display:grid;grid-template-columns:1112px 1fr;gap:34px}
.screen{border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(201,162,74,.35);align-self:start}
.screen .bar{height:36px;background:#e7e5df;display:flex;align-items:center;gap:8px;padding:0 14px}
.screen .bar i{width:11px;height:11px;border-radius:50%;background:#c9c5bb}
.screen .addr{margin-left:12px;flex:1;height:22px;border-radius:11px;background:#fff;color:#5b6159;font-size:13px;display:flex;align-items:center;padding:0 12px}
.vp{position:relative;width:1110px;height:694px;overflow:hidden;background:#f1f5f9}
.vp img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .45s ease}
.vp img.vis{opacity:1}
.spot{position:absolute;border-radius:8px;box-shadow:0 0 0 2000px rgba(8,14,10,.38),0 0 0 3px var(--oro),0 0 26px rgba(201,162,74,.8);transition:all .8s cubic-bezier(.45,.05,.2,1);pointer-events:none}
.spot.off{opacity:0}
.spot.pulse{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 2000px rgba(8,14,10,.38),0 0 0 7px var(--oro),0 0 40px rgba(201,162,74,1)}}
.mouse{position:absolute;width:34px;height:40px;left:560px;top:600px;transition:left .9s cubic-bezier(.45,.05,.2,1),top .9s cubic-bezier(.45,.05,.2,1),opacity .3s;pointer-events:none;z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.mouse.off{opacity:0}
.mouse.press{transform:scale(.85)}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--oro);opacity:0;pointer-events:none;z-index:4}
.rip.go{animation:rip .7s ease-out}
@keyframes rip{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(3.4)}}
.typ{position:absolute;display:flex;align-items:center;padding:0 10px;background:#fff;color:#111;font:600 17px/1.2 "Source Sans 3",Arial,sans-serif;border:2px solid var(--oro);border-radius:6px;z-index:3;white-space:nowrap;overflow:hidden}
.typ::after{content:"";width:2px;height:20px;background:#111;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sig{position:absolute;z-index:3;pointer-events:none}
.sig path{fill:none;stroke:#1d2a6b;stroke-width:4;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900}
.sig.go path{animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done{position:absolute;left:24px;top:22px;z-index:6;background:var(--verde);color:#fff;font-weight:800;font-size:24px;padding:10px 22px;border-radius:40px;box-shadow:0 6px 20px rgba(0,0,0,.35);transform:scale(.6);opacity:0;transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.done.on{transform:none;opacity:1}
.side{display:flex;flex-direction:column;gap:14px;min-width:0;padding-top:4px}
.side h3{font-size:42px}
.side .t{font-size:17px;color:var(--crema-dim);line-height:1.4;margin:0}
.side .t b{color:var(--crema)}
.steps{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:9px 12px 9px 50px;border-radius:10px;font-size:17.5px;line-height:1.32;color:var(--crema-dim);background:rgba(244,239,227,.04);border:1px solid transparent;transition:all .35s}
.steps li::before{content:counter(s);position:absolute;left:12px;top:8px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:rgba(201,162,74,.18);color:var(--oro-chiaro)}
.steps li.cur{color:var(--crema);background:rgba(201,162,74,.14);border-color:rgba(201,162,74,.55)}
.steps li.cur::before{background:var(--oro);color:var(--bosco)}
.steps li.seen::before{content:"✓";background:var(--verde);color:#fff}
.steps li.fin{display:none}
.steps li.fin.show{display:block;color:#d9f2df;background:rgba(63,164,91,.16);border-color:rgba(63,164,91,.6)}
.steps li.fin::before{content:"✓";background:var(--verde);color:#fff}
.steps li b{color:var(--oro-chiaro)}
.steps li.fin b{color:#fff}
.replay{align-self:flex-start;margin-top:auto;border:1px solid rgba(201,162,74,.5);background:none;color:var(--oro-chiaro);font:700 16px var(--f-testo);padding:9px 16px;border-radius:30px;cursor:pointer}
.replay:focus-visible,.ctl button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
/* chiusura */
.end{position:absolute;inset:0;padding:110px 130px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.end h2{font-size:104px}
.end ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px;max-width:1150px}
.end li{font-size:28px;line-height:1.35;display:grid;grid-template-columns:52px 1fr;align-items:baseline}
.end li span{font-family:var(--f-display);font-size:40px;color:var(--oro)}
.end li code{font-family:Consolas,monospace;background:rgba(244,239,227,.1);color:var(--oro-chiaro);padding:2px 10px;border-radius:6px;font-size:25px}
/* hud */
#hud{position:absolute;left:46px;right:46px;bottom:22px;display:flex;justify-content:space-between;font-size:15px;color:var(--crema-dim);letter-spacing:.06em;pointer-events:none;transition:opacity .4s}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--oro);transition:width .5s}
.ctl{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:10;opacity:.35;transition:opacity .3s}
.ctl:hover,.ctl:focus-within{opacity:1}
.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,162,74,.5);background:rgba(22,36,26,.85);color:var(--oro-chiaro);font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head><body>

<div id="viewport"><div id="stage" aria-live="polite"></div></div>

  <button id="b-next" type="button" aria-label="Avanti">&#8594;</button>
  <button id="b-full" type="button" aria-label="Schermo intero">&#9974;</button>
</div>

a", "box": [32, 291, 1224, 31], "act": "click", "cap": "Apri il menu <b>Scegli nota rapida…</b> sotto i pasti."}, {"img": "g3b", "box": [39, 383, 1210, 17], "act": "click", "cap": "Scegli <b>🔴 Assente</b>."}, {"img": "g3c", "box": [647, 328, 612, 50], "act": "type", "text": "Disturba durante lo studio", "cap": "La nota compare nel campo giallo. Per un fatto disciplinare scrivi nel campo rosa <b>Disc.</b>"}], "fine": {"img": "g3z", "cap": "Note salvate: le leggono anche i colleghi del turno dopo."}}, {"id": 4, "t": "Uscita anticipata", "task": "La mamma di DE SANTIS PAOLO lo viene a prendere alle <b>15:30</b>: registra l'uscita.", "steps": [{"img": "g4a", "box": [1188, 424, 32, 32], "act": "click", "cap": "Clicca la <b>porta arancione</b> 🚪 accanto al nome."}, {"img": "g4b", "box": [490, 252, 300, 40], "act": "type", "text": "15:30", "cap": "Scrivi l'<b>orario</b> di uscita."}, {"img": "g4c", "box": [496, 335, 293, 17], "act": "click", "cap": "In <b>Ritirato da</b> scegli chi viene a prenderlo."}, {"img": "g4d", "box": [490, 407, 300, 150], "act": "draw", "cap": "Fai <b>firmare</b> il genitore nel riquadro, con il dito o con il mouse."}, {"img": "g4e", "box": [490, 576, 300, 51], "act": "click", "cap": "Clicca <b>CONFERMA USCITA</b>."}], "fine": {"img": "g4z", "cap": "Uscita registrata, con orario e firma."}}, {"id": 5, "t": "Assenza prolungata", "task": "BIANCHI LUCA va in <b>gita dal 5 al 7 ottobre</b>: registra l'assenza.", "steps": [{"img": "g5a", "box": [1150, 185, 32, 32], "act": "click", "cap": "Clicca il <b>calendario</b> 📅 accanto al nome."}, {"img": "g5b", "box": [490, 312, 300, 40], "act": "type", "text": "05/10/2026", "cap": "Scegli il giorno di partenza in <b>Dal</b>."}, {"img": "g5c", "box": [490, 380, 300, 40], "act": "type", "text": "07/10/2026", "cap": "Scegli il giorno di rientro in <b>Al</b>."}, {"img": "g5d", "box": [496, 418, 293, 18], "act": "click", "cap": "In <b>Motivo</b> scegli <b>Gita scolastica</b>."}, {"img": "g5e", "box": [490, 503, 300, 51], "act": "click", "cap": "Clicca <b>CONFERMA ASSENZA</b>."}], "fine": {"img": "g5z", "cap": "Assenza registrata: nei giorni indicati il ragazzo risulta fuori, con il motivo."}}, {"id": 6, "t": "Il semaforo del comportamento", "task": "Controllo camere: DE SANTIS PAOLO ha la camera in disordine. Dagli il <b>semaforo rosso</b> sul decoro.", "steps": [{"img": "g6a", "box": [30, 424, 195, 26], "act": "click", "cap": "Clicca il <b>nome</b> del convittore: si apre la sua scheda."}, {"img": "g6b", "box": [548, 304, 76, 35], "act": "click", "cap": "Si apre la scheda. In <b>Valutazione giornaliera</b>, sotto <b>Decoro camera</b>, clicca il colore: qui il <b>rosso</b>."}], "fine": {"img": "g6z", "cap": "Valutazione registrata con il tuo nome. Si chiude la scheda con la X."}}, {"id": 7, "t": "Registrare un colloquio", "task": "La mamma di GALLI MATTEO ha telefonato: <b>registra il colloquio</b>.", "steps": [{"img": "g7a", "box": [427, 728, 213, 72], "act": "click", "cap": "In basso clicca <b>Colloqui</b>."}, {"img": "g7b", "box": [412, 175, 222, 19], "act": "click", "cap": "Scegli il convittore dall'elenco: <b>GALLI MATTEO</b>."}, {"img": "g7c", "box": [403, 205, 236, 51], "act": "click", "cap": "La mamma ha telefonato a te: <b>ENTRATA</b>."}, {"img": "g7d", "box": [403, 263, 236, 51], "act": "click", "cap": "Con chi hai parlato? <b>FAMIGLIA</b>."}, {"img": "g7e", "box": [405, 401, 470, 85], "act": "type", "text": "La mamma chiede se domani ha il rientro anticipato.", "cap": "Scrivi in breve il <b>contenuto</b> della telefonata."}, {"img": "g7f", "box": [405, 500, 470, 53], "act": "click", "cap": "Clicca <b>SALVA NOTA</b>."}], "fine": {"img": "g7z", "cap": "Il colloquio compare nello storico Famiglia del ragazzo."}}];

  } else if(s.t==='end'){
    h='<div class="end"><div class="eyebrow rise">Adesso tocca a voi</div><h2 class="rise d1">Missione <em>Convitto</em></h2><ol>'+
      '<li class="rise d2"><span>1</span><div>Prendete il vostro cartellino e aprite Chrome: <code>convitto-costaggini.github.io/formazione/prova</code></div></li>'+
      '<li class="rise d3"><span>2</span><div>Entrate con nome utente e password del cartellino.</div></li>'+
      '<li class="rise d3"><span>3</span><div>Lavorate sui vostri 3 convittori: le missioni sono quelle che avete appena visto.</div></li>'+
      '<li class="rise d4"><span>4</span><div>I punti compaiono da soli sullo schermo grande. Occhio agli imprevisti.</div></li></ol></div>';
  }
  d.innerHTML=h;stage.appendChild(d);
  if(s.t==='walk'){d.querySelector('.replay').addEventListener('click',function(e){e.stopPropagation();renderWalk(d,s,step,true);});}
  return d;
}
S.forEach(function(s){els.push(build(s));});
var hud=document.createElement('div');hud.id='hud';hud.innerHTML='<span class="l"></span><span class="r"></span>';stage.appendChild(hud);
var prog=document.createElement('div');prog.id='prog';stage.appendChild(prog);

function clear(){timers.forEach(clearTimeout);timers=[];}
function later(f,ms){timers.push(setTimeout(f,ms));}
function px(b){return {x:b[0]*SC,y:b[1]*SC,w:b[2]*SC,h:b[3]*SC};}
function renderWalk(d,s,k,replay){
  clear();
  var g=s.g,n=g.steps.length,vp=d.querySelector('.vp');
  var A=vp.querySelector('img.a'),B=vp.querySelector('img.b');
  var spot=vp.querySelector('.spot'),cur=vp.querySelector('.mouse'),rip=vp.querySelector('.rip'),typ=vp.querySelector('.typ'),sig=vp.querySelector('.sig'),done=vp.querySelector('.done');
  var st=k<n?g.steps[k]:null,src=IMG(st?st.img:g.fine.img);
  var vis=A.classList.contains('vis')?A:B,hid=vis===A?B:A;
  if(!vis.getAttribute('src')||vis.getAttribute('src').indexOf(src)<0){hid.src=src;hid.classList.add('vis');vis.classList.remove('vis');}
  typ.hidden=true;sig.hidden=true;sig.classList.remove('go');rip.classList.remove('go');spot.classList.remove('pulse');
  done.classList.toggle('on',!st);
  d.querySelectorAll('.steps li').forEach(function(li,i){
    li.classList.toggle('cur',i===k&&i<n);li.classList.toggle('seen',i<k&&i<n);
    if(li.classList.contains('fin')) li.classList.toggle('show',k>=n);
  });
  if(!st){spot.classList.add('off');cur.classList.add('off');return;}
  var b=px(st.box),pad=6;
  spot.classList.remove('off');
  spot.style.left=(b.x-pad)+'px';spot.style.top=(b.y-pad)+'px';spot.style.width=(b.w+2*pad)+'px';spot.style.height=(b.h+2*pad)+'px';
  var cx=b.x+Math.min(b.w/2,b.w-6),cy=b.y+b.h/2;
  if(st.act==='look'){cur.classList.add('off');later(function(){spot.classList.add('pulse');},700);return;}
  if(cur.classList.contains('off')){cur.style.transition='none';cur.style.left=(cx+120)+'px';cur.style.top=(cy+90)+'px';void cur.offsetWidth;cur.style.transition='';cur.classList.remove('off');}
  if(st.act==='draw'){cx=b.x+30*SC;cy=b.y+b.h*.63;}
  later(function(){cur.style.left=cx+'px';cur.style.top=cy+'px';},60);
  later(function(){
    if(st.act==='click'){rip.style.left=cx+'px';rip.style.top=cy+'px';void rip.offsetWidth;rip.classList.add('go');cur.classList.add('press');later(function(){cur.classList.remove('press');},180);}
    else if(st.act==='type'){
      typ.style.left=b.x+'px';typ.style.top=b.y+'px';typ.style.width=b.w+'px';typ.style.height=b.h+'px';typ.textContent='';typ.hidden=false;
      var txt=st.text||'',i=0;(function tick(){if(i<=txt.length){typ.textContent=txt.slice(0,i);i++;later(tick,txt.length>20?38:85);}})();
    }
    else if(st.act==='draw'){
      sig.style.left=b.x+'px';sig.style.top=b.y+'px';sig.style.width=b.w+'px';sig.style.height=b.h+'px';sig.hidden=false;void sig.offsetWidth;sig.classList.add('go');
      later(function(){cur.style.transition='left 1.5s ease, top 1.5s ease';cur.style.left=(b.x+b.w*.88)+'px';cur.style.top=(b.y+b.h*.45)+'px';later(function(){cur.style.transition='';},1600);},50);
    }
  },1000);
}
function render(){
  clear();
  els.forEach(function(e,i){e.classList.toggle('on',i===idx);e.setAttribute('aria-hidden',i===idx?'false':'true');});
  var s=S[idx];
  if(s.t==='walk') renderWalk(els[idx],s,step);
  hud.style.opacity=(s.t==='cover')?0:1;
  hud.querySelector('.l').textContent=(s.g?('Operazione '+s.g.id+' · '+s.g.t.replace(/<[^>]+>/g,'')):'Il gestionale, passo passo');
  hud.querySelector('.r').textContent=(idx+1)+' / '+S.length;
  prog.style.width=((idx+step/nsteps(s))/(S.length-1)*100)+'%';
}
function next(){var s=S[idx];if(step<nsteps(s)-1){step++;render();}else if(idx<S.length-1){idx++;step=0;render();}}
function prev(){if(step>0){step--;render();}else if(idx>0){idx--;step=nsteps(S[idx])-1;render();}}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='f'||e.key==='F'){full();}
  else if(e.key==='r'||e.key==='R'){if(S[idx].t==='walk')renderWalk(els[idx],S[idx],step,true);}
});
stage.addEventListener('click',function(e){if(e.target.closest('button,a'))return;next();});
document.getElementById('b-next').addEventListener('click',next);
document.getElementById('b-prev').addEventListener('click',prev);
function full(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen();}catch(e){}}
document.getElementById('b-full').addEventListener('click',full);
function fit(){var k=Math.min(window.innerWidth/1600,window.innerHeight/900);stage.style.transform='scale('+k+')';}
window.addEventListener('resize',fit);fit();
render();
})();
</script>
